services:
  postgres:
    image: postgres:16-alpine
    container_name: chengye-oa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chengye_oa}
      POSTGRES_USER: ${POSTGRES_USER:-chengye_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chengye_local_only}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-chengye_oa_test}
      POSTGRES_TEST_USER: ${POSTGRES_TEST_USER:-chengye_test}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:-chengye_test_local_only}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - chengye_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-chengye_app} -d $${POSTGRES_DB:-chengye_oa}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  chengye_postgres_data:
